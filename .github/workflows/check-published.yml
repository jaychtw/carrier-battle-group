name: Check published carrier modules
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the three public HTML responses
        shell: bash
        run: |
          set -eu
          for path in index.html module-1/index.html module-2/index.html; do
            route="$path"
            if [ "$path" = index.html ]; then route=""; fi
            url="https://jaychtw.github.io/carrier-battle-group/$route"
            status=$(curl --retry 4 --fail --silent --show-error --output "$RUNNER_TEMP/page.html" --write-out '%{http_code}' "$url")
            test "$status" = 200
            cmp "$path" "$RUNNER_TEMP/page.html"
            echo "$status $url matches the release"
          done
